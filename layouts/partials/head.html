<meta property="og:type" content="website">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Cline for Linux","applicationCategory":"DeveloperApplication","operatingSystem":"Linux","offers":{"@type":"Offer","price":"0"},"downloadUrl":"{{ .Site.Params.releaseURL }}","softwareHelp":"{{ .Site.Params.repoURL }}"}
</script>
{{ if in .RelPermalink "/faq/" }}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
{"@type":"Question","name":"Is Cline free on Linux?","acceptedAnswer":{"@type":"Answer","text":"The app is free and open-source (Apache 2.0). Model usage goes through providers — the Cline gateway offers 20+ free models plus a ClinePass free tier including Kimi K3."}},
{"@type":"Question","name":"AppImage or deb?","acceptedAnswer":{"@type":"Answer","text":"AppImage runs anywhere with one file; deb integrates with Debian/Ubuntu systems. Same app inside."}},
{"@type":"Question","name":"Do Linux builds auto-update?","acceptedAnswer":{"@type":"Answer","text":"Not yet — the updater feed currently serves macOS/Windows. Re-download new releases until feed support lands."}},
{"@type":"Question","name":"Which models are free?","acceptedAnswer":{"@type":"Answer","text":"Any gateway id ending in :free, subject to upstream availability and rate limits."}}
]}
</script>
{{ end }}
